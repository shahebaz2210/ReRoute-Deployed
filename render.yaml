services:
  - type: web
    name: dispatchx-optimizer
    runtime: python
    rootDir: services/optimizer
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPTIMIZER_WORKER_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
